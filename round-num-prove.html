<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Round · prova numeri</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        padding: 20px 16px 36px;
        background:
          radial-gradient(ellipse 70% 55% at 50% 40%, rgba(40, 28, 20, 0.18), rgba(12, 8, 6, 0.72)),
          url("./art/ui/bg-choice-grimm.jpg?v=grimm3") center / cover no-repeat,
          #1a1210;
        font-family: Georgia, serif;
        color: #e8d8b8;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 0.06em;
        text-align: center;
        color: #d4b890;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 18px;
        max-width: 1100px;
        margin: 0 auto;
        justify-items: center;
      }
      /* Same rules as .round-hud.is-ink — fixed prove scale = 1 (168px ≈ in-game at ~0.67). */
      .stamp {
        --ui-scale: 0.67;
        position: relative;
        width: calc(252px * var(--ui-scale));
        aspect-ratio: 1;
        line-height: 0;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.4));
      }
      .stamp img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .stamp .num {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, calc(-50% - 15.87px * var(--ui-scale)));
        display: block;
        width: max-content;
        max-width: 78%;
        margin: 0;
        padding: 0.05em 0;
        text-align: center;
        font-family: Georgia, "Times New Roman", Times, serif;
        font-weight: 700;
        font-size: calc(90px * var(--ui-scale));
        letter-spacing: 0;
        line-height: 1;
        color: #f2a83a;
        -webkit-text-fill-color: #f2a83a;
        text-shadow:
          0 1px 0 #5a3a12,
          0 2px 3px rgba(30, 16, 4, 0.65);
        pointer-events: none;
        overflow: visible;
      }
      .stamp .num.is-digit-2 {
        transform: translate(-50%, calc(-50% - 10.87px * var(--ui-scale)));
      }
      .stamp .num.is-digit-6,
      .stamp .num.is-digit-8 {
        transform: translate(-50%, calc(-50% - 2.5px * var(--ui-scale)));
      }
      .stamp .num.is-wide {
        font-size: calc(74px * var(--ui-scale));
        letter-spacing: -0.01em;
        max-width: 78%;
        transform: translate(-50%, calc(-50% - 10.5px * var(--ui-scale)));
      }
      .cap {
        margin: 6px 0 0;
        text-align: center;
        font-size: 12px;
        color: #a89070;
      }
      .note {
        max-width: 40rem;
        margin: 18px auto 0;
        text-align: center;
        font-size: 13px;
        color: #a89070;
      }
    </style>
  </head>
  <body>
    <h1>Round · numeri 1 → 12 (stesso CSS del gioco)</h1>
    <div class="grid" id="grid"></div>
    <p class="note">Una cifra e due cifre, stessa dimensione. Controlla centraggio nel disco nero.</p>
    <script>
      const grid = document.getElementById('grid');
      for (let n = 1; n <= 12; n++) {
        const dig = String(n);
        const wide = dig.length >= 2;
        const cls = ['num'];
        if (wide) cls.push('is-wide');
        else if (n === 2) cls.push('is-digit-2');
        else if (n === 6) cls.push('is-digit-6');
        else if (n === 8) cls.push('is-digit-8');
        const cell = document.createElement('div');
        cell.innerHTML =
          `<div class="stamp" aria-label="Round ${dig}">` +
          `<img src="./art/ui/round-ink-seal.png?v=ink5" alt="" />` +
          `<span class="${cls.join(' ')}">${dig}</span>` +
          `</div><p class="cap">${dig}${wide ? ' · due cifre' : ''}</p>`;
        grid.appendChild(cell);
      }
    </script>
  </body>
</html>
