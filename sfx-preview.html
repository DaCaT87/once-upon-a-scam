<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suoni</title>
    <style>
      body {
        margin: 0;
        background: #1a120e;
        color: #f3efe4;
        font-family: Georgia, serif;
      }
      main {
        width: min(720px, 94vw);
        margin: 0 auto;
        padding: 28px 0 48px;
      }
      h1 {
        font-size: 40px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 22px;
        font-size: 18px;
        opacity: 0.8;
      }
      h2 {
        margin: 26px 0 8px;
        font-size: 22px;
      }
      button {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: baseline;
        width: 100%;
        margin: 8px 0;
        padding: 12px 14px;
        font: inherit;
        font-size: 18px;
        text-align: left;
        color: #1a120e;
        background: #f3efe4;
        border: 0;
        cursor: pointer;
      }
      button small {
        font-size: 14px;
        opacity: 0.62;
        text-align: right;
        max-width: 52%;
      }
      button.is-on {
        background: #e7c56a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Suoni</h1>
      <p>Clicca uno. Parte quello e l’altro si ferma.</p>
      <div id="list"></div>
    </main>
    <script type="module" src="/src/sfx-board.ts"></script>
  </body>
</html>
