<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finale · pellicola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Cinzel:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --design-w: 1920;
        --design-h: 1080;
        --card-w: 288px;
        --card-h: calc(var(--card-w) * 972 / 642);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #050304;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        left: 50%;
        top: 50%;
        width: calc(var(--design-w) * 1px);
        height: calc(var(--design-h) * 1px);
        transform: translate(-50%, -50%) scale(var(--ui-scale, 1));
        transform-origin: center center;
        background: #0a0706;
        overflow: hidden;
      }
      .film {
        position: absolute;
        left: 50%;
        top: 54%;
        width: 1920px;
        height: auto;
        transform: translate(-50%, -50%);
        z-index: 1;
        pointer-events: none;
      }
      .film img {
        display: block;
        width: 100%;
        height: auto;
      }
      .cards {
        position: absolute;
        left: 50%;
        top: 56%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 22px;
        z-index: 3;
      }
      .cards img {
        width: var(--card-w);
        height: var(--card-h);
        object-fit: cover;
        border-radius: 4px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.55);
      }
      /* 1940s title-card white */
      .tale {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, calc(-100% - var(--card-h) / 2 - 36px));
        z-index: 4;
        margin: 0;
        width: max-content;
        max-width: 92%;
        text-align: center;
        color: #f7f2e8;
        font-family: "Limelight", "Cinzel", "Times New Roman", serif;
        font-weight: 400;
        font-size: 44px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        text-shadow:
          0 0 1px rgba(255, 255, 255, 0.35),
          0 2px 0 rgba(0, 0, 0, 0.55),
          0 0 28px rgba(255, 248, 230, 0.12);
        line-height: 1.25;
      }
      .tale .place {
        display: block;
        margin-top: 0.2em;
        font-size: 1.15em;
        letter-spacing: 0.22em;
      }
      .chrome {
        position: fixed;
        left: 14px;
        bottom: 10px;
        z-index: 10;
        font: 12px/1.3 Georgia, serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a7460;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="film">
        <img src="./art/ui/ending-film-table.png?v=1" alt="" />
      </div>
      <div class="cards">
        <img src="./art/units/hunter/card.png?v=1" alt="" />
        <img src="./art/units/sir-forget-a-lot/card.png?v=1" alt="" />
        <img src="./art/units/village-fool/card.png?v=1" alt="" />
        <img src="./art/units/royal-herald/card.png?v=1" alt="" />
      </div>
      <p class="tale">
        Your Tale ends in…
        <span class="place">2nd place</span>
      </p>
    </div>
    <div class="chrome">Prova · tavolo 1920×1080 · pellicola + carte · titolo anni ’40</div>
    <script>
      const fit = () => {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        document.documentElement.style.setProperty('--ui-scale', String(s));
      };
      fit();
      addEventListener('resize', fit);
    </script>
  </body>
</html>
