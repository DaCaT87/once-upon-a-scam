<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Tizia cartello</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #100c0a; display: grid; place-items: center; font-family: Georgia, serif; color: #f2e6c8; }
    .stage { position: relative; width: min(420px, 90vw); aspect-ratio: 3/4; }
    .stage img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; object-position: center bottom;
      opacity: 0; animation: cel 1s linear infinite;
    }
    .stage img:nth-child(2) { animation-delay: 0.25s; }
    .stage img:nth-child(3) { animation-delay: 0.5s; }
    .stage img:nth-child(4) { animation-delay: 0.75s; }
    @keyframes cel {
      0%, 24.99% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
    p { margin-top: 18px; opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <div>
    <div class="stage">
      <img src="./art/ui/vs-pinup-1.png?v=pinup14" alt="" />
      <img src="./art/ui/vs-pinup-2.png?v=pinup14" alt="" />
      <img src="./art/ui/vs-pinup-3.png?v=pinup14" alt="" />
      <img src="./art/ui/vs-pinup-4.png?v=pinup14" alt="" />
    </div>
    <p style="text-align:center">Loop come in gioco · cartello fermo</p>
  </div>
</body>
</html>
