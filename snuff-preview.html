<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snuff preview — fiamma grande, miccia fissa</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 24px;
      background: #1a1410;
      color: #e8d8b0;
      font: 16px/1.4 Georgia, serif;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 400; }
    .tag { font-size: 12px; opacity: 0.6; letter-spacing: 0.04em; text-transform: uppercase; }
    .hint { opacity: 0.85; font-size: 14px; text-align: center; max-width: 42rem; margin: 0; }
    .stage {
      width: min(520px, 94vw);
      background: #2f2926;
      border: 2px solid #3a2a1c;
      border-radius: 8px;
      overflow: hidden;
      line-height: 0;
    }
    .stage img { display: block; width: 100%; height: auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    button {
      appearance: none;
      border: 2px solid #c9a045;
      background: linear-gradient(180deg, #e0c06a, #b8862e);
      color: #2a1c10;
      font: 600 15px/1 Georgia, serif;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
    }
    .state { font-size: 13px; opacity: 0.75; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="tag">candela del GIF · fiamma ingrandita · miccia non toccata</div>
  <h1>Accesa → spegnimento</h1>
  <p class="hint">
    Loop accesa: fiamma più grande sopra la <b>miccia originale</b> (non scalata).
    Poi lo spegnimento del GIF sulla stessa candela.
  </p>
  <div class="stage">
    <img id="clip" alt="Candle" />
  </div>
  <div class="state" id="state">Accesa</div>
  <div class="row">
    <button type="button" id="snuffBtn">Spegni</button>
    <button type="button" id="again">Ricomincia</button>
  </div>
  <script>
    const clip = document.getElementById('clip');
    const state = document.getElementById('state');
    let auto = 0;
    let end = 0;
    const LIT = './art/ui/candle-snuff-lit.gif?v=14';
    const FULL = './art/ui/candle-snuff-full.gif?v=14';

    function lit() {
      clearTimeout(auto);
      clearTimeout(end);
      clip.src = LIT + '&t=' + Date.now();
      state.textContent = 'Accesa (fiamma grande, miccia fissa)';
      auto = setTimeout(blow, 3200);
    }
    function blow() {
      clearTimeout(auto);
      clearTimeout(end);
      clip.src = FULL + '&t=' + Date.now();
      state.textContent = 'Spegnimento';
      end = setTimeout(lit, 5200);
    }
    document.getElementById('snuffBtn').onclick = blow;
    document.getElementById('again').onclick = lit;
    lit();
  </script>
</body>
</html>
