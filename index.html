<!doctype html>
<html lang="en" class="is-booting is-menu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var vv = window.visualViewport;
        var w = vv ? vv.width : window.innerWidth;
        var rawH = vv ? vv.height : window.innerHeight;
        var coarse = window.matchMedia('(pointer: coarse)').matches;
        var noHover = window.matchMedia('(hover: none)').matches;
        var shortSide = Math.min(window.screen.width, window.screen.height);
        var handheld = coarse && noHover && shortSide > 0 && shortSide < 700;
        var topGap = handheld ? 0 : 18;
        var h = Math.max(1, rawH - topGap);
        var tallPhone = h > w && w < 700;
        var DESIGN_W = 1920;
        var DESIGN_H = 1080;
        var designW = tallPhone ? 640 : DESIGN_W;
        var scale = tallPhone ? w / designW : Math.min(w / DESIGN_W, h / DESIGN_H);
        // Boot is always the menu. Desktop keeps 16:9; phone fills the screen.
        var frameMenu = !tallPhone && !handheld;
        var root = document.documentElement;
        if (handheld) root.classList.add('is-handheld');
        root.style.setProperty('--ui-scale', String(scale));
        root.style.setProperty('--design-w', String(frameMenu ? DESIGN_W : w / scale));
        root.style.setProperty('--design-h', String(frameMenu ? DESIGN_H : h / scale));
        root.style.setProperty('--vv-x', (frameMenu ? Math.max(0, (w - DESIGN_W * scale) / 2) : 0) + 'px');
        root.style.setProperty('--vv-y', topGap + 'px');
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="Patch & Fable — a sticker autobattler." />
    <title>Patch & Fable</title>

      .field-seam, .hunt-brambles { display: none !important; }
    </style>

    />

    <link rel="stylesheet" crossorigin href="./assets/index-DTK-To34.css">
